name: Build Next.js portfolio

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/build_for_and_web_ios.yml'
  workflow_dispatch:

concurrency:
  group: portfolio-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run build --prefix site
      - name: Update the static web export
        run: |
          rsync -a --delete --exclude '/vercel.json' site/out/ web_build/
          git add -- web_build
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update the static portfolio export'
          git push origin HEAD:main
